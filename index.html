<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidney Shae | Artist & Designer</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- ================= INTRO ================= -->
<header id="intro" class="intro-section">
  <div class="nameplate">
    <h1>Sidney Shae</h1>
    <p class="subtitle">Artist & Designer</p>
    <p class="location">MI | TX</p>
  </div>

  <button class="scroll-arrow" aria-label="Scroll to projects">
    ↓
  </button>
</header>

<!-- ================= PROJECT OVERVIEW ================= -->
<section id="projects" class="project-overview">

  <div class="project-layout">

    <!-- LEFT COLUMN (FIXED) -->
    <aside class="project-filter">
      <table class="filter-table">
        <thead>
          <tr>
            <th>Tag</th>
            <th>Check</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Graphic Design</td>
            <td><input type="checkbox" data-tag="graphic"></td>
          </tr>
          <tr>
            <td>UX / UI</td>
            <td><input type="checkbox" data-tag="uxui"></td>
          </tr>
          <tr>
            <td>Web Design</td>
            <td><input type="checkbox" data-tag="web"></td>
          </tr>
          <tr>
            <td>Social Media</td>
            <td><input type="checkbox" data-tag="social"></td>
          </tr>
        </tbody>
      </table>
    </aside>

    <!-- RIGHT COLUMN (SCROLLS) -->
    <div class="project-feed">

      <article class="project-card" data-tags="graphic uxui">
  <a href="projects/project1.html">

    <img
      src="assets/images/project1-hero.jpg"
      alt="Project One preview"
      class="project-image"
    >

    <footer class="project-footer">
      <div class="footer-line"></div>

      <h3>Project One</h3>

      <div class="pill-row">
        <div class="pill">
          <span class="pill-label">TAG</span>
          Graphic Design
        </div>
        <div class="pill">
          <span class="pill-label">TAG</span>
          UX / UI
        </div>
        <div class="pill">
          <span class="pill-label">DATE</span>
          12 / 2025
        </div>
      </div>

      <div class="footer-line"></div>
    </footer>

  </a>
</article>


<article class="project-card" data-tags="social web">
  <a href="projects/project2.html">

    <img
      src="assets/images/project2-hero.jpg"
      alt="Project Two preview"
      class="project-image"
    >

    <footer class="project-footer">
      <div class="footer-line"></div>

      <h3>Project Two</h3>

      <div class="pill-row">
        <div class="pill">
          <span class="pill-label">TAG</span>
          Social Media
        </div>
        <div class="pill">
          <span class="pill-label">TAG</span>
          Web Design
        </div>
        <div class="pill">
          <span class="pill-label">DATE</span>
          12 / 2025
        </div>
      </div>

      <div class="footer-line"></div>
    </footer>

  </a>
</article>


    </div>
  </div>
</section>

<!-- ================= CONTACT ================= -->
<section id="contact" class="contact-section">

  <!-- LEFT: SQUARE IMAGE -->
  <div class="contact-image-wrapper">
    <img
      src="assets/images/patch-pink-blue.png"
      alt="Contact image"
      class="contact-image"
    >
  </div>

  <!-- RIGHT: TEXT + FORM -->
  <div class="contact-form">
    <p class="contact-intro">
      Questions, comments, or ideas? Let’s connect!
    </p>

    <form class="contact-form-fields">

      <!-- NAME + EMAIL -->
      <div class="form-row">
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email" required>
      </div>

      <!-- MESSAGE + SEND -->
      <div class="form-row message-row">
        <textarea placeholder="Message" required></textarea>
        <button type="submit" aria-label="Send message">→</button>
      </div>

    </form>
  </div>
</section>

<footer>
  <p>Made by Sidney Shae</p>
</footer>

<script src="main.js"></script>
</body>
</html>
