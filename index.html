<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>s</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="index-page">

<!-- GLOBAL NAV (FADE-IN VERSION) -->
<header class="site-header">
  <nav class="header-nav">

    <a href="../index.html" class="nav-home">Home</a>

    <div class="nav-projects">
      <button class="projects-toggle">
        Projects ▾
      </button>

      <ul class="projects-dropdown">
        <li><a href="Projects/project1.html">Service Express</a></li>
        <li><a href="Projects/project2.html">CATA</a></li>
        <li><a href="Projects/project3.html">Client Portfolio</a></li>
        <li><a href="Projects/project4.html">SEE-Insights AI App</a></li>
      </ul>
    </div>

  </nav>
</header>

<div class="page-wrapper">

<!-- ================= INTRO ================= -->
<header id="intro" class="intro-section">
  <div class="nameplate">
    <img
      src="assets/images/sidney-nameplate.png"
      alt="Sidney Shae Designer & Artist"
    >
  </div>

  <button class="scroll-arrow" aria-label="Scroll to projects">
    ↓
  </button>
</header>

<!-- ================= PROJECT OVERVIEW ================= -->
<section id="projects" class="project-overview">

  <div class="project-layout">

    <!-- LEFT COLUMN -->
    <aside class="project-filter">
      <table class="filter-table">
        <thead>
          <tr>
            <th>Tag</th>
            <th>Check</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Graphic Design</td>
            <td><input type="checkbox" data-tag="graphic"></td>
          </tr>
          <tr>
            <td>UX / UI</td>
            <td><input type="checkbox" data-tag="uxui"></td>
          </tr>
          <tr>
            <td>Web Design</td>
            <td><input type="checkbox" data-tag="web"></td>
          </tr>
          <tr>
            <td>Social Media</td>
            <td><input type="checkbox" data-tag="social"></td>
          </tr>
        </tbody>
      </table>
    </aside>

    <!-- RIGHT COLUMN -->
    <div class="project-feed">

      <!-- (UNCHANGED PROJECT CARDS) -->
      <!-- keep everything exactly as you had it -->

    </div>
  </div>
</section>

<!-- ================= CONTACT ================= -->
<section id="contact" class="contact-section">

  <div class="contact-image-wrapper">
    <img
      src="assets/images/patch-pink-blue.png"
      alt="Contact image"
      class="contact-image"
    >
  </div>

  <div class="contact-form">
    <p class="contact-intro">
      Questions, comments, or ideas? Let’s connect!
    </p>

    <form class="contact-form-fields">

      <div class="form-row">
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email" required>
      </div>

      <div class="form-row message-row">
        <textarea placeholder="Message" required></textarea>
        <button type="submit" aria-label="Send message">→</button>
      </div>

    </form>
  </div>
</section>

</div>

<footer>
  <p>Made by Sidney Shae</p>
</footer>

<script src="main.js"></script>
</body>
</html>
