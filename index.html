<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidney Shae | Artist & Designer</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- ================= INTRO ================= -->
<header id="intro" class="intro-section">
  <div class="nameplate">
    <h1>Sidney Shae</h1>
    <p class="subtitle">Artist & Designer</p>
    <p class="location">MI | TX</p>
  </div>

  <button class="scroll-down" data-scroll-target="#projects" aria-label="Scroll to projects">
    ↓
  </button>
</header>

<!-- ================= PROJECT OVERVIEW ================= -->
<main id="projects" class="project-overview-section">

  <!-- FILTER -->
  <aside class="filter-column">
    <table class="filter-table">
      <thead>
        <tr>
          <th>Tag</th>
          <th>Check</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Graphic Design</td>
          <td><input type="checkbox" data-tag="graphic"></td>
        </tr>
        <tr>
          <td>UX / UI</td>
          <td><input type="checkbox" data-tag="uxui"></td>
        </tr>
        <tr>
          <td>Web Design</td>
          <td><input type="checkbox" data-tag="web"></td>
        </tr>
        <tr>
          <td>Social Media</td>
          <td><input type="checkbox" data-tag="social"></td>
        </tr>
      </tbody>
    </table>
  </aside>

  <!-- PROJECT WINDOW -->
  <section class="projects-window" aria-label="Projects">

    <div class="projects-scroll">

      <!-- PROJECT 1 -->
      <article class="project-card" data-tags="graphic uxui">
        <a href="projects/project1.html">

          <div class="project-image">
            <img src="assets/images/project1-hero.jpg" alt="Project One preview">
          </div>

          <footer class="project-footer">
            <div class="footer-line"></div>

            <h3>Project One</h3>

            <div class="pill-row">

              <div class="pill">
                <span class="pill-label">TAG 1</span>
                Graphic Design
              </div>

              <div class="pill">
                <span class="pill-label">TAG 2</span>
                UX / UI
              </div>

              <div class="pill">
                <span class="pill-label">DATE</span>
                12 / 2025
              </div>

            </div>

            <div class="footer-line"></div>
          </footer>

        </a>
      </article>

      <!-- PROJECT 2 -->
      <article class="project-card" data-tags="web social">
        <a href="projects/project2.html">

          <div class="project-image">
            <img src="assets/images/project2-hero.jpg" alt="Project Two preview">
          </div>

          <footer class="project-footer">
            <div class="footer-line"></div>

            <h3>Project Two</h3>

            <div class="pill-row">

              <div class="pill">
                <span class="pill-label">TAG 1</span>
                Web Design
              </div>

              <div class="pill">
                <span class="pill-label">TAG 2</span>
                Social Media
              </div>

              <div class="pill">
                <span class="pill-label">DATE</span>
                12 / 2025
              </div>

            </div>

            <div class="footer-line"></div>
          </footer>

        </a>
      </article>

    </div>
  </section>
</main>

<script src="main.js"></script>
</body>
</html>
