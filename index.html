<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidney Shae | Artist & Designer</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- ================= INTRO ================= -->
<header id="intro" class="intro-section">
  <div class="nameplate">
    <h1>Sidney Shae</h1>
    <p class="subtitle">Artist & Designer</p>
    <p class="location">MI | TX</p>
  </div>

  <button class="scroll-arrow" aria-label="Scroll to projects">
    ↓
  </button>
</header>

<!-- ================= PROJECT OVERVIEW ================= -->
<section id="projects" class="project-overview">

  <div class="project-layout">

    <!-- LEFT COLUMN (FIXED) -->
    <aside class="project-filter">
      <table class="filter-table">
        <thead>
          <tr>
            <th>Tag</th>
            <th>Check</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Graphic Design</td>
            <td><input type="checkbox" data-tag="graphic"></td>
          </tr>
          <tr>
            <td>UX / UI</td>
            <td><input type="checkbox" data-tag="uxui"></td>
          </tr>
          <tr>
            <td>Web Design</td>
            <td><input type="checkbox" data-tag="web"></td>
          </tr>
          <tr>
            <td>Social Media</td>
            <td><input type="checkbox" data-tag="social"></td>
          </tr>
        </tbody>
      </table>
    </aside>

    <!-- RIGHT COLUMN (SCROLLS) -->
    <div class="project-feed">

      <article class="project-card" data-tags="graphic uxui">
        <img src="assets/images/project1-hero.jpg" alt="">
        <footer class="project-footer">
          <h3>Project One</h3>
        </footer>
      </article>

      <article class="project-card" data-tags="web social">
        <img src="assets/images/project2-hero.jpg" alt="">
        <footer class="project-footer">
          <h3>Project Two</h3>
        </footer>
      </article>

    </div>
  </div>
</section>

<!-- ================= CONTACT ================= -->
<section id="contact" class="contact-section">
  <div class="contact-image"></div>

  <div class="contact-form">
    <h2>Let’s connect</h2>
    <form>
      <input type="text" placeholder="Name">
      <input type="email" placeholder="Email">
      <textarea placeholder="Message"></textarea>
      <button>→</button>
    </form>
  </div>
</section>

<script src="main.js"></script>
</body>
</html>
